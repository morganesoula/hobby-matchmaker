name: CI

on:
    push:
        branches: [ main, develop ]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
    lint:
        name: Detekt
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write # upload SARIF to code scanning
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21

            -   uses: gradle/actions/setup-gradle@v5

            -   name: Run Detekt
                run: ./gradlew detektAll

            -   name: Upload SARIF to code scanning
                if: always() && hashFiles('build/reports/detekt/detekt.sarif') != ''
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: build/reports/detekt/detekt.sarif
                    category: detekt

            -   name: Upload HTML report
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: detekt-report
                    path: build/reports/detekt/detekt.html
                    if-no-files-found: ignore

    android:
        name: Android build
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21

            -   uses: gradle/actions/setup-gradle@v5

            # Real config comes from the GOOGLE_SERVICES_JSON secret (base64). Without it (e.g. fork PRs),
            # a placeholder is used: the build compiles but Firebase won't work at runtime.
            -   name: Provide google-services.json
                env:
                    GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
                run: |
                    if [ -n "$GOOGLE_SERVICES_JSON" ]; then
                      echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
                    else
                      echo "::warning::GOOGLE_SERVICES_JSON secret not set, using a placeholder"
                      cat > androidApp/google-services.json <<'JSON'
                    {
                      "project_info": {
                        "project_number": "000000000000",
                        "project_id": "ci-placeholder",
                        "storage_bucket": "ci-placeholder.appspot.com"
                      },
                      "client": [{
                        "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                          "android_client_info": { "package_name": "com.msoula.hobbymatchmaker" }
                        },
                        "oauth_client": [],
                        "api_key": [{ "current_key": "ci-placeholder" }],
                        "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
                      }],
                      "configuration_version": "1"
                    }
                    JSON
                    fi

            -   name: Assemble debug APK
                run: ./gradlew :androidApp:assembleDebug

            -   name: Upload debug APK
                uses: actions/upload-artifact@v7
                with:
                    name: hobbymatchmaker-debug-apk
                    path: androidApp/build/outputs/apk/debug/*.apk
                    retention-days: 14

    ios:
        name: iOS compile
        runs-on: macos-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21

            -   uses: gradle/actions/setup-gradle@v5

            -   name: Cache Kotlin/Native toolchain
                uses: actions/cache@v6
                with:
                    path: ~/.konan
                    key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
                    restore-keys: konan-${{ runner.os }}-

            -   name: Compile shared code for iOS simulator
                run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
