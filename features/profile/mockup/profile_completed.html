<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>User Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ec5b13",
            "background-light": "#f8f6f6",
            "background-dark": "#201a19",
          },
          fontFamily: {
            "display": ["Public Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    body {
      font-family: "Public Sans", sans-serif;
      background-color: #120e0d;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-[#120e0d]">
<!-- Mobile Device Frame Container -->
<main class="w-full max-w-[420px] bg-[#201a19] min-h-screen sm:min-h-[890px] sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col justify-between border border-[#352b29] relative">
<!-- Top Status Bar (iOS Style) -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center text-xs font-semibold tracking-tight text-[#d1c4c1] select-none">
<span class="text-sm font-semibold tracking-normal text-white">9:41</span>
<div class="flex items-center gap-1.5 text-white">
<span class="material-symbols-outlined text-[17px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px]">wifi</span>
<span class="material-symbols-outlined text-[20px] rotate-90 leading-none">battery_full</span>
</div>
</header>
<!-- Top Header Navigation -->
<nav class="flex items-center justify-between px-5 py-2 select-none">
<button aria-label="Go back" class="flex size-10 items-center justify-center rounded-full bg-[#2d2422] text-[#d1c4c1] hover:text-white hover:bg-[#3d312e] transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-white">Profile</h1>
<button aria-label="Settings" class="flex size-10 items-center justify-center rounded-full bg-[#2d2422] text-[#d1c4c1] hover:text-white hover:bg-[#3d312e] transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">settings</span>
</button>
</nav>
<!-- Main Scrollable Profile Content -->
<div class="flex-1 overflow-y-auto px-5 pb-6 space-y-6"><!-- Avatar & User Info Section -->
<section class="flex flex-col items-center pt-1 text-center">
<!-- Playful Cinephile Avatar Container -->
<div class="relative group cursor-pointer mb-3">
<div class="size-28 rounded-full p-[3px] bg-gradient-to-tr from-[#ec5b13] via-[#ff9900] to-[#fd9800] shadow-[0_0_24px_rgba(236,91,19,0.35)] relative">
<div class="w-full h-full rounded-full bg-[#2b2220] flex items-center justify-center overflow-hidden border-2 border-[#201a19]">
<img class="w-full h-full object-cover" data-alt="Alex Chen portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxXzWYIFdoLPHbASbDXi6yISmKMlUU5ow8FzKyeBaBiDQVSuHNfJIh6UsK6XXgWrlxSEez9YaoHw6zTyn-wMNgklyO3b6JmFGgduReFL2gNIYWBF2k_VNyhDwWDwhIlGBofB7ec6vhEHasUjzEF8j-WwB0frYJYyRWPINeVobT68hljwOm2SzI11Zi9CdXxdBhLAweBp9qVfkNAtrYD5OImXo2SiNLOOqX0JnZ8LciiBpvFTcZ2iv9tg">
</div>
</div>
<!-- Cinephile playful status badge -->

</div>
<!-- User Identifiers -->
<div class="mt-3.5 space-y-1">
<div class="flex items-center justify-center gap-1.5">
<h2 class="text-2xl font-bold tracking-tight text-white">Alex Chen</h2>
<span class="material-symbols-outlined text-[#ff9900] text-[18px]" style="font-variation-settings: &quot;FILL&quot; 1;">verified</span>
</div>
<p class="text-xs font-semibold text-[#ec5b13] tracking-wide">@alexchen</p>
<p class="text-xs text-[#c4b3af] max-w-[280px] pt-1 leading-relaxed italic">
      "Looking for someone who won't talk during Interstellar 🌌"
    </p>
</div>
<!-- Tactile Pill Edit Profile Button -->
<div class="mt-3.5 flex items-center gap-2">
<button class="flex items-center justify-center gap-2 px-5 py-2 rounded-full bg-gradient-to-r from-[#ec5b13] to-[#fd9800] text-white font-semibold text-xs shadow-[0_4px_14px_rgba(236,91,19,0.35)] hover:shadow-[0_6px_20px_rgba(236,91,19,0.5)] active:scale-98 transition-all" type="button">
<span class="material-symbols-outlined text-[15px]">edit</span>
<span class="">Edit Profile</span>
</button>
<button aria-label="Share profile" class="size-8 rounded-full bg-[#2a2220] border border-[#3e322f] flex items-center justify-center text-[#c4b3af] hover:text-white hover:border-[#ec5b13]/50 transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">ios_share</span>
</button>
</div>
</section>
<!-- Playful Gamified Stats Grid (3 bite-sized cards) -->
<section aria-label="Cinema Stats" class="w-full"><div class="bg-[#2a2220] border border-[#ec5b13]/60 rounded-2xl p-3 flex items-center justify-between relative overflow-hidden group hover:border-[#ec5b13] transition-all px-5 py-3"><div class="flex items-center gap-3"><span class="text-2xl">🎬</span><div class="flex flex-col text-left"><span class="text-sm font-semibold text-white tracking-tight">Favorite Movies</span></div></div><div class="flex items-center gap-1.5"><span class="text-2xl font-extrabold text-[#ff9900] tracking-tight">15</span><span class="text-xs font-medium text-[#c4b3af]">movies</span></div><div class="absolute bottom-0 left-0 right-0 h-[2px] bg-[#ec5b13] opacity-60"></div></div></section>
<!-- Currently Obsessed With / Cinema Vibe Card -->

<!-- Favorite Cinema Vibes / Micro Chips -->
<section class="space-y-2.5">
<div class="flex items-center justify-between">
<h3 class="text-sm font-bold text-white tracking-tight flex items-center gap-1.5">
<span class="">Favorite Cinema Genres</span>
<span class="text-xs font-normal text-[#a69591]">(4)</span>
</h3>
<button class="text-xs text-[#ec5b13] hover:underline font-semibold flex items-center gap-0.5" type="button">


</button>
</div>
<div class="flex flex-wrap gap-2">
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#2a2220] border border-[#ec5b13]/60 text-white text-xs font-semibold shadow-sm hover:border-[#ec5b13] transition-colors cursor-pointer">
<span class="">🚀</span>
<span class="">Sci-Fi</span>
</span>
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#2a2220] border border-[#3e322f] text-[#d1c4c1] hover:text-white text-xs font-semibold shadow-sm hover:border-[#ec5b13]/60 transition-colors cursor-pointer">
<span class="">🕵️</span>
<span class="">Noir Thriller</span>
</span>
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#2a2220] border border-[#3e322f] text-[#d1c4c1] hover:text-white text-xs font-semibold shadow-sm hover:border-[#ec5b13]/60 transition-colors cursor-pointer">
<span class="">💥</span>
<span class="">High-Octane Action</span>
</span>
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#2a2220] border border-[#3e322f] text-[#d1c4c1] hover:text-white text-xs font-semibold shadow-sm hover:border-[#ec5b13]/60 transition-colors cursor-pointer">
<span class="">🌀</span>
<span class="">Mind-benders</span>
</span>
</div>
</section>
<!-- Taste Compass / Cinema Mood Banner -->
</div>
<!-- Bottom Home Indicator Bar (iOS Style) -->
<footer class="w-full pb-2 pt-1 flex justify-center items-center select-none bg-[#201a19]">
<div class="w-32 h-1 bg-[#473936] rounded-full"></div>
</footer>
</main>




</body></html>
