      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface antialiased flex justify-center min-h-screen">
<!-- Mobile/Responsive Wrapper -->
<main class="w-full max-w-md min-h-screen flex flex-col bg-surface border-x border-surface-container-highest shadow-2xl relative pb-20">
<!-- Top App Bar / Profile Header -->

<!-- Content Container -->
<div class="flex-1 px-4 py-4 space-y-6">
<!-- 1. User Identity & Placeholder Avatar -->
<section class="flex flex-col items-center text-center pt-2">
<div class="relative group cursor-pointer mb-3">
<!-- Neutral placeholder avatar with dashed warm glow -->
<div class="w-28 h-28 rounded-full border-2 border-dashed border-primary/50 bg-surface-container flex flex-col items-center justify-center p-1 relative overflow-hidden transition-all duration-300 group-hover:border-primary group-hover:bg-surface-container-high">
<span class="material-symbols-outlined text-4xl text-outline mb-1">person</span>
<span class="text-[11px] font-semibold text-primary flex items-center gap-0.5">
<span class="material-symbols-outlined text-[13px]">add_a_photo</span>ePhoto
            </span>
</div>
<!-- Quick add badge -->

</div>
<div class="space-y-1">
<h2 class="text-on-surface text-xl font-bold tracking-tight">New Cinephile</h2>
<p class="text-on-surface-variant text-sm font-normal">@newcinephile</p>
</div>
<!-- Onboarding Progress Hint -->

<!-- Edit / Complete Profile CTA -->
<div class="mt-4 w-full flex items-center justify-center gap-2">
<button class="w-full max-w-xs flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl border-2 border-primary text-primary hover:bg-primary/10 transition-all font-semibold text-sm active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]">edit</span>
<span class="">Complete Profile</span>
</button>
</div>
</section>
<!-- 2. Stats Counters (Empty State Cards side-by-side) -->
<section class="grid grid-cols-2 gap-3">
<!-- Liked Movies Card -->
<div class="flex flex-col justify-between p-4 rounded-xl bg-surface-card border border-surface-border relative overflow-hidden">
<div class="flex items-center justify-between">
<span class="text-xs font-medium text-on-surface-variant">Liked Movies</span>
<span class="material-symbols-outlined text-primary/70 text-[18px]">movie</span>
</div>
<div class="mt-2">
<span class="text-3xl font-extrabold text-on-surface">0</span>
</div>

</div>
<!-- Connections Card -->
<div class="flex flex-col justify-between p-4 rounded-xl bg-surface-card border border-surface-border relative overflow-hidden">
<div class="flex items-center justify-between">
<span class="text-xs font-medium text-on-surface-variant">Connections</span>
<span class="material-symbols-outlined text-secondary/70 text-[18px]">group</span>
</div>
<div class="mt-2 flex items-baseline gap-1">
<span class="text-3xl font-extrabold text-on-surface">0</span>
<span class="text-sm font-semibold text-text-muted">/ 5</span>
</div>

</div>
</section>
<!-- 3. Favorite Genres / Interests Empty State -->

<!-- 4. "My Social Circle" Section with Empty State Block -->
<section class="space-y-3">
<div class="flex items-center justify-between">
<div>
<h3 class="text-on-surface font-bold text-base tracking-tight">My Social Circle</h3>

</div>

</div>
<!-- Dedicated Empty State Card -->
<div class="p-6 rounded-2xl bg-surface-card border border-surface-border flex flex-col items-center text-center relative overflow-hidden">
<!-- Subtle decorative radial halo -->
<div class="absolute -top-12 -right-12 w-28 h-28 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="w-14 h-14 rounded-full bg-secondary-container/40 border border-secondary/30 flex items-center justify-center text-secondary mb-3">
<span class="material-symbols-outlined text-2xl">group_add</span>
</div>
<h4 class="text-on-surface font-bold text-base">Your circle is empty</h4>
<p class="text-on-surface-variant text-xs mt-1 max-w-[260px] leading-relaxed">
            Invite your movie buddies to compare tastes and get matched on cinema nights!
          </p>
<button class="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-primary hover:bg-secondary text-on-primary font-bold text-xs tracking-wide transition-all shadow-md active:scale-95">
<span class="material-symbols-outlined text-[16px]">send</span>
<span class="">Invite Friends</span>
</button>
</div>
</section>
<!-- 5. Account Settings & Logout -->
<section class="pt-2 pb-6 border-t border-surface-container-high space-y-2">


<!-- Discreet Logout Button -->
<button class="w-full mt-3 flex items-center justify-center gap-2 px-4 py-2 text-xs font-medium hover:text-error transition-colors text-primary">
<span class="material-symbols-outlined text-[16px]">logout</span>
<span class="">Log out</span>
</button>
</section>
</div>
<!-- Immutable Shared Component: BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-30 flex justify-center pointer-events-none">
<div class="w-full max-w-md pointer-events-auto">

</div>
