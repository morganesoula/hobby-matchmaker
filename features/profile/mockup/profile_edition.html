<!-- Selected Initial Chip 2 -->
<button class="chip-item selected flex items-center gap-1.5 px-4 py-2 rounded-xl text-body-md font-body-md font-semibold bg-primary-container text-on-primary-container shadow-md shadow-primary-container/20" data-chip="Photography" type="button">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: &quot;FILL&quot; 1;">check</span>
<span>Photography</span>
</button>
<!-- Selected Initial Chip 3 -->
<button class="chip-item selected flex items-center gap-1.5 px-4 py-2 rounded-xl text-body-md font-body-md font-semibold bg-primary-container text-on-primary-container shadow-md shadow-primary-container/20" data-chip="Bouldering" type="button">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: &quot;FILL&quot; 1;">check</span>
<span>Bouldering</span>
</button>
<!-- Unselected Chip -->
<button class="chip-item flex items-center gap-1.5 px-4 py-2 rounded-xl text-body-md font-body-md hover:border-primary/40 active:scale-95 selected bg-primary-container text-on-primary-container font-semibold shadow-md shadow-primary-container/20" data-chip="Ceramics" type="button"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings: &quot;FILL&quot; 1;">check</span>
<span>Ceramics</span>
</button>
<!-- Unselected Chip -->
<button class="chip-item flex items-center gap-1.5 px-4 py-2 rounded-xl text-body-md font-body-md hover:border-primary/40 active:scale-95 selected bg-primary-container text-on-primary-container font-semibold shadow-md shadow-primary-container/20" data-chip="Cooking" type="button"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings: &quot;FILL&quot; 1;">check</span>

</button>
<!-- Unselected Chip -->
<button class="chip-item unselected flex items-center gap-1.5 px-4 py-2 rounded-xl text-body-md font-body-md bg-surface-container-low text-on-surface border border-surface-border hover:border-primary/40 active:scale-95" data-chip="Synthesizers" type="button">
<span>Synthesizers</span>
</button>
<!-- Unselected Chip -->

</button>
<!-- Unselected Chip -->

</button>

</button>

<!-- Inline Custom Tag Input Container (Hidden by default) -->
<div class="hidden items-center gap-2 mt-2 p-2 rounded-xl bg-surface-container-low border border-primary/30" id="custom-tag-form">

<button class="px-3 py-1.5 rounded-lg bg-primary text-background-dark font-label-md text-label-md font-bold hover:scale-105 active:scale-95 transition-all" id="submit-custom-tag" type="button">
              Add
            </button>
<button class="p-1 rounded-lg text-outline hover:text-on-surface transition-colors" id="cancel-custom-tag" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Notice Banner: Max limit reminder / feedback -->
<div class="items-center gap-2 px-3.5 py-2.5 rounded-xl bg-primary-container/10 border border-primary-container/30 text-primary flex" id="max-limit-banner">
<span class="material-symbols-outlined text-[18px]">info</span>
<span class="text-label-xs font-label-xs">5 max, remove one to add another</span>

<!-- Save confirmation toast -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full bg-surface-container-high border border-primary-container text-on-surface text-body-md font-body-md shadow-2xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50" id="toast">
<span class="material-symbols-outlined text-primary-container text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
<span>Profile updated successfully</span>
</div>
</div>
<!-- Interactive Logic -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Elements
      const nameInput = document.getElementById('name-input');
      const nameErrorMsg = document.getElementById('name-error-msg');
      const bioInput = document.getElementById('bio-input');
      const charCount = document.getElementById('char-count');
      const chipsContainer = document.getElementById('chips-container');
      const interestBadge = document.getElementById('interest-badge');
      const maxBanner = document.getElementById('max-limit-banner');
      const addTagBtn = document.getElementById('add-tag-btn');
      const customTagForm = document.getElementById('custom-tag-form');
      const customTagInput = document.getElementById('custom-tag-input');
      const submitCustomTag = document.getElementById('submit-custom-tag');
      const cancelCustomTag = document.getElementById('cancel-custom-tag');
      const saveBtn = document.getElementById('save-btn');
      const toast = document.getElementById('toast');

      const MAX_INTERESTS = 5;

      // 1. Name Validation
      function validateName() {
        if (!nameInput.value.trim()) {
          nameErrorMsg.classList.remove('hidden');
          nameInput.classList.add('border-error');
          nameInput.classList.remove('border-surface-border', 'focus:border-primary-container');
          return false;
        } else {
          nameErrorMsg.classList.add('hidden');
          nameInput.classList.remove('border-error');
          nameInput.classList.add('border-surface-border', 'focus:border-primary-container');
          return true;
        }
      }

      nameInput.addEventListener('input', validateName);

      // 2. Bio Character Counter
      bioInput.addEventListener('input', () => {
        const length = bioInput.value.length;
        charCount.textContent = length;
        if (length >= 120) {
          charCount.classList.add('text-error');
        } else {
          charCount.classList.remove('text-error');
        }
      });

      // Initialize counter
      charCount.textContent = bioInput.value.length;

      // 3. Chip State Management
      function updateBadgeAndBanner() {
        const selectedChips = chipsContainer.querySelectorAll('.chip-item.selected');
        const count = selectedChips.length;
        interestBadge.textContent = `${count}/${MAX_INTERESTS}`;

        if (count >= MAX_INTERESTS) {
          maxBanner.classList.remove('hidden');
          maxBanner.classList.add('flex');
        } else {
          maxBanner.classList.add('hidden');
          maxBanner.classList.remove('flex');
        }
      }

      function toggleChip(button) {
        const isSelected = button.classList.contains('selected');
        const currentCount = chipsContainer.querySelectorAll('.chip-item.selected').length;

        if (!isSelected) {
          // Attempting to select
          if (currentCount >= MAX_INTERESTS) {
            // Flash banner
            maxBanner.classList.remove('hidden');
            maxBanner.classList.add('flex');
            maxBanner.classList.add('animate-bounce');
            setTimeout(() => maxBanner.classList.remove('animate-bounce'), 800);
            return;
          }

          // Select chip
          button.classList.remove('unselected', 'bg-surface-container-low', 'text-on-surface', 'border', 'border-surface-border');
          button.classList.add('selected', 'bg-primary-container', 'text-on-primary-container', 'font-semibold', 'shadow-md', 'shadow-primary-container/20');
          
          // Insert check icon if not present
          if (!button.querySelector('.material-symbols-outlined')) {
            const checkIcon = document.createElement('span');
            checkIcon.className = 'material-symbols-outlined text-[16px]';
            checkIcon.style = "font-variation-settings: 'FILL' 1;";
            checkIcon.textContent = 'check';
            button.prepend(checkIcon);
          }
        } else {
          // Deselect chip
          button.classList.remove('selected', 'bg-primary-container', 'text-on-primary-container', 'font-semibold', 'shadow-md', 'shadow-primary-container/20');
          button.classList.add('unselected', 'bg-surface-container-low', 'text-on-surface', 'border', 'border-surface-border');

          // Remove check icon
          const icon = button.querySelector('.material-symbols-outlined');
          if (icon) icon.remove();
        }

        updateBadgeAndBanner();
      }

      // Attach click events on current chips
      chipsContainer.addEventListener('click', (e) => {
        const chipBtn = e.target.closest('.chip-item');
        if (chipBtn) {
          toggleChip(chipBtn);
        }
      });

      // 4. Custom Tag Inline Creation
      addTagBtn.addEventListener('click', () => {
        customTagForm.classList.remove('hidden');
        customTagForm.classList.add('flex');
        customTagInput.focus();
      });

      cancelCustomTag.addEventListener('click', () => {
        customTagForm.classList.add('hidden');
        customTagForm.classList.remove('flex');
        customTagInput.value = '';
      });

      function addCustomTag() {
        const val = customTagInput.value.trim();
        if (!val) return;

        const currentCount = chipsContainer.querySelectorAll('.chip-item.selected').length;
        const newChip = document.createElement('button');
        newChip.type = 'button';
        newChip.dataset.chip = val;

        if (currentCount < MAX_INTERESTS) {
          newChip.className = 'chip-item selected flex items-center gap-1.5 px-4 py-2 rounded-xl text-body-md font-body-md font-semibold bg-primary-container text-on-primary-container shadow-md shadow-primary-container/20';
          newChip.innerHTML = `<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span><span>${val}</span>`;
        } else {
          newChip.className = 'chip-item unselected flex items-center gap-1.5 px-4 py-2 rounded-xl text-body-md font-body-md bg-surface-container-low text-on-surface border border-surface-border hover:border-primary/40 active:scale-95';
          newChip.innerHTML = `<span>${val}</span>`;
        }

        // Insert before the "+ Add your own" button
        chipsContainer.insertBefore(newChip, addTagBtn);

        customTagInput.value = '';
        customTagForm.classList.add('hidden');
        customTagForm.classList.remove('flex');

        updateBadgeAndBanner();
      }

      submitCustomTag.addEventListener('click', addCustomTag);
      customTagInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addCustomTag();
        }
      });

      // 5. Save Action
      saveBtn.addEventListener('click', () => {
        if (!validateName()) return;

        // Feedback toast trigger
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        
        saveBtn.disabled = true;
        saveBtn.classList.add('opacity-50');

        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
          saveBtn.disabled = false;
          saveBtn.classList.remove('opacity-50');
        }, 2200);
      });
    });
  </script>
