<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary">
<!-- Container max-w mobile shell simulation / responsive container -->
<div class="w-full max-w-md mx-auto flex flex-col min-h-screen bg-background border-x border-outline-variant/30 shadow-2xl relative">
<!-- Top Bar -->
<header class="sticky top-0 z-20 flex items-center justify-between px-4 py-3 bg-surface/95 backdrop-blur-md border-b border-outline-variant/20">
<button aria-label="Go back" class="flex size-10 items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-on-surface text-lg font-bold tracking-tight text-center flex-1">Social Circle</h1>
<button aria-label="Filter and Settings" class="flex size-10 items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-2xl">tune</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-4 pt-4 pb-6 space-y-6">
<!-- Segmented Tabs -->
<section aria-label="Invitations view filter" class="w-full">
<div class="flex h-11 w-full items-center justify-center rounded-xl bg-surface-container p-1 border border-outline-variant/30">
<!-- Received (Active) -->
<button class="flex-1 h-full flex items-center justify-center rounded-lg bg-surface-container-highest text-primary font-semibold text-sm shadow-sm transition-all duration-200" type="button">
<span class="">Received</span>
<span class="ml-1.5 px-1.5 py-0.5 rounded-full text-xs font-bold bg-primary-container/20 text-primary">0</span>
</button>
<!-- Sent (Inactive) -->
<button class="flex-1 h-full flex items-center justify-center rounded-lg text-on-surface-variant font-medium text-sm hover:text-on-surface transition-all duration-200" type="button">
<span class="">Sent</span>
<span class="ml-1.5 px-1.5 py-0.5 rounded-full text-xs font-medium bg-surface-container-highest/60 text-on-surface-variant">2</span>
</button>
</div>
</section>
<!-- Central Empty State Card -->
<section class="flex-1 flex flex-col items-center justify-center py-2 space-y-6">
<!-- Glowing Circular Badge Illustration -->
<div class="relative flex items-center justify-center">
<div class="absolute -inset-3 rounded-full bg-primary-container/20 blur-xl animate-pulse"></div>
<div class="relative flex size-24 items-center justify-center rounded-full bg-gradient-to-b from-surface-container-high to-surface-card border border-primary-container/40 shadow-inner">
<span class="material-symbols-outlined text-4xl text-primary">mark_email_unread</span>
</div>
</div>
<!-- Empty State Typography -->
<div class="text-center space-y-2 max-w-xs px-2">
<h2 class="text-on-surface text-xl font-bold tracking-tight">No Pending Invites</h2>
<p class="text-on-surface-variant text-sm leading-relaxed">
            No one has sent you an invite yet. Share your handle so your friends can connect with you and discover mutual movie matches!
          </p>
</div>
<!-- QR Code / Profile ID Card Container -->
<div class="w-full rounded-2xl bg-surface-container border border-outline-variant/40 p-5 shadow-lg flex flex-col items-center space-y-4">
<!-- User Tag / Pseudo Header -->
<div class="flex flex-col items-center">
<span class="text-xs font-semibold tracking-wider uppercase text-secondary">Pseudo</span>
<span class="text-lg font-bold text-on-surface mt-0.5 tracking-tight">@alex_c</span>
</div>
<!-- Stylized QR Code Graphic Container with Corner Brackets -->

<!-- QR Caption -->

</div>
</section>
</main>
<!-- Bottom Navigation Bar -->

</div>
