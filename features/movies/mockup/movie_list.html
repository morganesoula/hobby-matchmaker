<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>HobbyMatchMaker - Movie Discovery</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Modern iOS Aesthetic -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" class="">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              charcoal: '#181211',
              surface: '#201a19',
              card: '#292120',
              accent: '#FD9800',
              accentHover: '#e08600',
              muted: '#8A8280',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Layout & Carousel Styles -->
<style data-purpose="layout-styles">
    /* Hide scrollbars while allowing smooth swipe & snap */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .card-shadow {
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.7), 0 0 25px 2px rgba(253, 152, 0, 0.08);
    }

    /* Ambient background gradient effect */
    .ambient-glow {
      background: radial-gradient(circle at 50% 45%, rgba(253, 152, 0, 0.12) 0%, rgba(24, 18, 17, 0) 70%);
    }
  </style>
<!-- END: Custom Layout & Carousel Styles -->
</head>
<body class="bg-brand-charcoal text-white font-sans antialiased select-none overflow-x-hidden min-h-screen flex justify-center items-center p-0 m-0">
<!-- Mobile Screen Shell (iOS Dimensions 390x844 approx scaled) -->
<div class="relative w-full max-w-sm sm:max-w-md h-[100dvh] bg-brand-charcoal flex flex-col justify-between overflow-hidden shadow-2xl">
<!-- Ambient Warm Glow in Background -->
<div class="ambient-glow absolute inset-0 pointer-events-none z-0"></div>
<!-- BEGIN: iOS Status Bar -->

<!-- END: iOS Status Bar -->
<!-- BEGIN: App Navigation Header -->
<nav class="relative z-20 w-full px-6 pt-3 pb-2 flex items-center justify-end" data-purpose="top-navigation"><div class="flex flex-col flex-1 mr-2"></div>
<!-- App Brand Title / Subtitle -->

<!-- Action Buttons (Invites & Profile) -->
<div class="flex items-center space-x-3" data-purpose="header-action-buttons">
<!-- Received/Sent Invitations Button with Badge -->
<button aria-label="Friends &amp; Invitations" class="relative w-10 h-10 rounded-full bg-brand-surface/90 border border-white/10 flex items-center justify-center text-white/90 active:scale-95 transition-all hover:bg-brand-surface hover:border-brand-accent/40 shadow-md" type="button">
<!-- User Plus / Invitation Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Notification Indicator -->
<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-brand-accent ring-2 ring-brand-charcoal"></span>
</button>
<!-- User Profile Avatar/Button -->
<button aria-label="User Profile" class="w-10 h-10 rounded-full bg-brand-surface/90 border border-white/10 flex items-center justify-center text-white/90 active:scale-95 transition-all hover:bg-brand-surface hover:border-brand-accent/40 shadow-md overflow-hidden" type="button">
<!-- Profile Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</nav>
<!-- END: App Navigation Header -->
<!-- BEGIN: Main Movie Carousel Section -->
<main class="relative z-10 w-full flex-1 flex flex-col justify-center my-auto py-2 overflow-hidden" data-purpose="movie-carousel-container">
<!-- Interactive Horizontal Movie Carousel Strip -->
<div class="flex items-center gap-4 overflow-x-auto hide-scrollbar snap-x snap-mandatory scroll-smooth py-2 px-5 h-full" id="carousel-slider" style="scroll-padding: 0px 1.5rem; padding-left: 1.5rem; padding-right: 2rem;"><!-- Center Main Active Card: The Rip -->
<div id="featured-card" class="snap-center shrink-0 w-[270px] sm:w-[290px] rounded-3xl bg-brand-surface/90 border border-white/10 overflow-hidden shadow-2xl flex flex-col transition-all duration-300 relative group">
  <!-- Poster Image Container with Gradient Overlay -->
  <div class="relative w-full aspect-[2/3] overflow-hidden bg-brand-card">
    <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="The Rip Poster" class="w-full h-full object-cover select-none transition-transform duration-500 group-hover:scale-105">
    <div class="absolute inset-0 bg-gradient-to-t from-brand-charcoal via-transparent to-black/40"></div>
    
    <!-- Top Badges / Floating Actions -->
    <div class="absolute top-3 inset-x-3 flex items-center justify-between z-10">
      <!-- Rating Badge -->
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md border border-white/15 text-xs font-semibold text-white shadow-md">
        <svg class="w-3.5 h-3.5 text-brand-accent fill-current" viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
        </svg>
        <span class="">8.7</span>
      </div>
      
      <!-- Like / Favorite Heart Button -->
      <button id="like-button" aria-label="Like Movie" class="w-9 h-9 rounded-full bg-black/60 backdrop-blur-md border border-white/15 flex items-center justify-center text-white active:scale-95 transition-all shadow-md hover:bg-black/80" type="button">
        <svg class="w-5 h-5 fill-current text-brand-accent" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
        </svg>
      </button>
    </div>
    
    <!-- Movie Title & Details Overlay -->
    <div class="absolute bottom-3 inset-x-3.5 z-10 flex flex-col gap-1">
      <div class="flex items-center gap-2 text-[11px] font-semibold text-brand-accent uppercase tracking-wider">
        
        <span class="w-1 h-1 rounded-full bg-white/40"></span>
        
      </div>
      <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-white drop-shadow-md leading-tight">The Rip</h2>
      
    </div>
  </div>
</div>

<!-- Peeking Right Card (Next Movie: Dune: Part Two) -->
<div class="snap-center shrink-0 w-[270px] sm:w-[290px] rounded-3xl bg-brand-surface/70 border border-white/5 overflow-hidden shadow-xl flex flex-col opacity-75 scale-95 transition-all duration-300 relative">
  <div class="relative w-full aspect-[2/3] overflow-hidden bg-brand-card">
    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Dune Part Two Poster" class="w-full h-full object-cover select-none">
    <div class="absolute inset-0 bg-gradient-to-t from-brand-charcoal via-transparent to-black/50"></div>
    <div class="absolute top-3 left-3 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md border border-white/15 text-xs font-semibold text-white">
      <svg class="w-3.5 h-3.5 text-brand-accent fill-current" viewBox="0 0 20 20">
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
      </svg>
      <span class="">8.9</span>
    </div>
    <div class="absolute bottom-3 inset-x-3.5 z-10 flex flex-col gap-1">
      <div class="flex items-center gap-2 text-[11px] font-semibold text-brand-accent uppercase tracking-wider">
        
      </div>
      <h2 class="text-xl font-bold tracking-tight text-white drop-shadow-md leading-tight">Dune: Part Two</h2>
    </div>
  </div>
</div></div>
<!-- BEGIN: Carousel Indicators & Swipe Hint -->

<!-- END: Carousel Indicators & Swipe Hint -->
</main>
<!-- END: Main Movie Carousel Section -->
<!-- BEGIN: Bottom Tab / Quick Action Bar -->
<nav class="relative z-30 w-full bg-[#1e1716]/95 backdrop-blur-md border-t border-white/10 flex flex-col items-center px-6 pt-2 pb-3 shrink-0 shadow-lg" data-purpose="bottom-navigation"><div class="w-full max-w-xs flex items-center justify-around"><button type="button" class="flex flex-col items-center gap-0.5 text-[#ff9900] py-1 px-4 rounded-xl transition-all duration-200 active:scale-95"><span class="material-symbols-outlined text-[24px]" style="font-variation-settings: &quot;FILL&quot; 1, &quot;wght&quot; 600;">home</span><span class="text-[11px] font-bold tracking-wide">Home</span></button><button type="button" class="flex flex-col items-center gap-0.5 text-[#94a3b8] hover:text-[#ece0de] py-1 px-4 rounded-xl transition-all duration-200 active:scale-95"><span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0, 'wght' 400;">hub</span><span class="text-[11px] font-medium tracking-wide">Hub</span></button></div><div class="w-32 h-1 bg-white/20 rounded-full mt-2"></div></nav>
<!-- END: Bottom Tab / Quick Action Bar -->
</div>
<!-- BEGIN: Interactive Touch / Scroll Handler -->
<script data-purpose="carousel-scroll-behavior">
    // Center the featured movie card on initial view
    document.addEventListener("DOMContentLoaded", () => {
      const carousel = document.getElementById("carousel-slider");
      const featuredCard = document.getElementById("featured-card");
      
      if (carousel && featuredCard) {
        // Offset center positioning
        const cardOffset = featuredCard.offsetLeft - (carousel.clientWidth / 2) + (featuredCard.clientWidth / 2);
        carousel.scrollLeft = cardOffset;
      }

      // Like Button toggle effect
      const likeBtn = document.getElementById("like-button");
      if (likeBtn) {
        likeBtn.addEventListener("click", () => {
          likeBtn.classList.toggle("text-brand-accent");
          likeBtn.classList.toggle("text-red-500");
          likeBtn.classList.toggle("scale-125");
          setTimeout(() => likeBtn.classList.remove("scale-125"), 200);
        });
      }
    });
  </script>
<!-- END: Interactive Touch / Scroll Handler -->




</body></html>
